"$scheme" = "https://jj-vsc.github.io/jj/prerelease/config-schema.json"

[user]
name = "Pranav RK"
email = "pranavrk7@gmail.com"

[signing]
behavior = "own"
backend = "gpg"
key = "2CD64D94C9C7CA59"

[ui]
diff-formatter = ":git"
pager = "delta"
diff-editor = "meld"
merge-editor = "meld"
graph.style = "square"
default-command = "log"

[merge-tools.difft]
program = "difft"
diff-args = ["--color-always", "$left", "$right"]

[git]
auto-local-bookmark = false
write-change-id-header = true

# adapted from <https://github.com/jj-vcs/jj/wiki/Starship>
# append this file to your starship config and correct any duplicate keys as you see fit
[custom.jj]
description = "The current jj status"
when = "jj --ignore-working-copy root"
command = '''
jj log --revisions @ --no-graph --ignore-working-copy --color always --limit 1 --template '
  separate(" ",
    change_id.shortest(4),
    bookmarks,
    "|",
    raw_escape_sequence("\x1b[1;31m") ++
    concat(
      if(conflict, "(conflict)"),
      if(divergent, "(divergent)"),
      if(hidden, "(hidden)"),
      if(immutable, "(immutable)"),
    ) ++
    raw_escape_sequence("\x1b[0m"),
    raw_escape_sequence("\x1b[1;32m") ++ if(empty, "(empty)"),
    raw_escape_sequence("\x1b[1;32m") ++ coalesce(
      truncate_end(29, description.first_line(), "…"),
      "(no description set)",
    ) ++ raw_escape_sequence("\x1b[0m"),
  )
'
'''

[git_status]
disabled = true

[custom.git_status]
when = "! jj --ignore-working-copy root"
command = "starship module git_status"
style = "" # This disables the default "(bold green)" style
description = "Only show git_status if we're not in a jj repo"

[git_commit]
disabled = true

[custom.git_commit]
when = "! jj --ignore-working-copy root"
command = "starship module git_commit"
style = ""
description = "Only show git_commit if we're not in a jj repo"

[git_metrics]
disabled = true

[custom.git_metrics]
when = "! jj --ignore-working-copy root"
command = "starship module git_metrics"
description = "Only show git_metrics if we're not in a jj repo"
style = ""

[git_branch]
disabled = true

[custom.git_branch]
when = "! jj --ignore-working-copy root"
command = "starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"
style = ""
